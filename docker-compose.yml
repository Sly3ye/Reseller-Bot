# Reseller Bot self-hosted — Postgres + backend (FastAPI/scheduler/scraper).
# Gira identico in locale (per provare) e sul VPS Hetzner (produzione).
#
#   cp .env.example .env        # imposta POSTGRES_PASSWORD, Telegram
#   docker compose up -d
#
# Il frontend (Next.js) si lancia a parte (npm run dev, o Vercel) e punta a
# NEXT_PUBLIC_API_BASE_URL = URL di questo backend.

services:
  db:
    # 17 per allinearsi alla versione di Supabase (da cui viene il dump iniziale).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reseller
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito automaticamente SOLO al primo avvio (volume vuoto).
      - ./database/selfhosted/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Solo da questa macchina (psql/TablePlus/DBeaver, script dump/restore).
      # Prima era "5432:5432" = aperta a tutta la rete, con password di
      # default: chiunque in LAN poteva leggere o cancellare i dati. Il
      # backend ci arriva in interno (host "db"), non gli serve la porta.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reseller"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env        # Telegram + ritmo scraping (facoltativi)
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/reseller
      MEDIA_ROOT: /data/media
      # URL da cui il browser carica le immagini: in produzione = dominio/IP del VPS.
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Solo dashboard e API: la raccolta la fa il servizio `collector`.
      # Si ricostruisce e riavvia senza interrompere inventari e alert.
      SCHEDULER_ENABLED: "false"
      # Sovrascrivibile dal .env di root (es. un raccoglitore avviato a mano).
      COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8000}
      # Tutte le auto di Subito (vedi docs/GOAL-VERSION.md, §8 "Ambito").
      AUTO_FULL_CATEGORY: ${AUTO_FULL_CATEGORY:-false}
      AUTO_INVENTORY_SLICES: ${AUTO_INVENTORY_SLICES:-4}
    volumes:
      - media:/data/media
      # Esito dell'ultimo backup (servizio `backup`), per cruscotto e allarme.
      - ./backups:/backups:ro
    ports:
      # Solo da questa macchina: l'API non ha login. Per usarla da un altro
      # dispositivo serve prima un'autenticazione (o una VPN/tunnel).
      - "127.0.0.1:8000:8000"
    # Per raggiungere Ollama (AI locale) in esecuzione sull'HOST via
    # host.docker.internal, anche su Linux/VPS (su Docker Desktop è già presente).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Raccoglitore: scheduler (sweep, inventari, foto, alert, bot Telegram).
  # Stessa immagine dell'API, nessuna porta esposta. Su una seconda macchina
  # che non deve raccogliere: SCHEDULER_ENABLED=false nel .env di root.
  collector:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env        # Telegram + ritmo scraping (facoltativi)
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/reseller
      MEDIA_ROOT: /data/media
      # URL da cui il browser carica le immagini: in produzione = dominio/IP del VPS.
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Facoltativi: solo questi lavori / tutti tranne questi (id separati da virgola).
      SCHEDULER_ONLY: ${SCHEDULER_ONLY:-}
      SCHEDULER_SKIP: ${SCHEDULER_SKIP:-}
      # Tutte le auto di Subito (vedi docs/GOAL-VERSION.md, §8 "Ambito").
      AUTO_FULL_CATEGORY: ${AUTO_FULL_CATEGORY:-false}
      AUTO_INVENTORY_SLICES: ${AUTO_INVENTORY_SLICES:-4}
    volumes:
      - media:/data/media
      # Esito dell'ultimo backup (servizio `backup`), per cruscotto e allarme.
      - ./backups:/backups:ro
    # Per raggiungere Ollama (AI locale) in esecuzione sull'HOST via
    # host.docker.internal, anche su Linux/VPS (su Docker Desktop è già presente).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Backup notturno di DB + foto con ripristino di prova (F2): vedi
  # scripts/backup_loop.sh. File in ./backups (db/ e media/); l'esito in
  # ./backups/last_backup.json lo mostra il cruscotto Qualità del dato.
  # Un giro subito:  docker compose run --rm -e BACKUP_NOW=1 backup
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Europe/Rome
      BACKUP_HOUR: ${BACKUP_HOUR:-5}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - media:/media:ro
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    entrypoint: ["sh", "/backup_loop.sh"]

volumes:
  pgdata:
  media:
