# Reseller Bot self-hosted — Postgres + backend (FastAPI/scheduler/scraper).
# Gira identico in locale (per provare) e sul VPS Hetzner (produzione).
#
#   cp .env.example .env        # imposta POSTGRES_PASSWORD, proxy, Telegram
#   docker compose up -d
#
# Il frontend (Next.js) si lancia a parte (npm run dev, o Vercel) e punta a
# NEXT_PUBLIC_API_BASE_URL = URL di questo backend.

services:
  db:
    # 17 per allinearsi alla versione di Supabase (da cui viene il dump iniziale).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reseller
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito automaticamente SOLO al primo avvio (volume vuoto).
      - ./database/selfhosted/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Per consultare i dati dal Mac con psql/TablePlus/DBeaver e per gli
      # script dump/restore. Sul VPS in produzione valuta di rimuoverla o
      # restringerla nel firewall: il backend nel container ci arriva già
      # in interno (host "db"), non serve esporla pubblicamente.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reseller"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env        # proxy IPRoyal + Telegram (facoltativi)
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/reseller
      MEDIA_ROOT: /data/media
      # URL da cui il browser carica le immagini: in produzione = dominio/IP del VPS.
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
